name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the Claude Code validator
        run: npm install --global @anthropic-ai/claude-code@2.1.270
      - name: Validate manifests and components
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate skills --strict
          claude plugin validate agents --strict
      - name: Test the independent connection with synthetic OAuth credentials
        run: |
          node --test scripts/callback-page.test.cjs
          npx --yes --ignore-scripts --package=mcp-remote@0.14.2 --package=@modelcontextprotocol/sdk@1.30.0 --package=proper-lockfile@4.1.2 node scripts/conversation-signin.test.cjs
          python3 scripts/test_desktop_connection.py
          python3 scripts/test_remote_connection.py
          python3 scripts/test_slow_signin.py
      - name: Build and validate the distribution
        run: |
          python3 scripts/package_plugin.py
          python3 -m zipfile -e dist/adzviser-[0-9]*.zip /tmp/adzviser-distribution
          claude plugin validate /tmp/adzviser-distribution --strict
